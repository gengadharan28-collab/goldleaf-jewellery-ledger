@if (cmdOpen()) {
  <div class="gl-ng-cmd-backdrop" (click)="closeCmd()">
    <section class="gl-ng-cmd-modal" role="dialog" aria-modal="true" aria-label="Quick Jump" (click)="$event.stopPropagation()">
      <div class="gl-ng-cmd-head">
        <span class="gl-ng-cmd-icon">⌕</span>
        <input
          id="glNgCmdInput"
          type="search"
          [ngModel]="cmdQuery()"
          (ngModelChange)="cmdQuery.set($event)"
          [placeholder]="lang() === 'ta' ? 'பக்கம் தேடுங்கள் (கொட்டேஷன், விற்பனை, சீட்டு, அறிக்கைகள்)…' : 'Jump to Quotation, Sales Entry, Chit, Jewel Loan, 129 Reports…'"
          autocomplete="off" />
        <button type="button" class="gl-ng-cmd-esc" (click)="closeCmd()">ESC</button>
      </div>
      <div class="gl-ng-cmd-list">
        @for (mod of filteredModules(); track mod.id) {
          <button
            type="button"
            class="gl-ng-cmd-item"
            [class.is-current]="activePage() === mod.id"
            (click)="jumpTo(mod)">
            <span class="gl-ng-cmd-item-ico">{{ mod.icon }}</span>
            <span class="gl-ng-cmd-item-txt">
              <b>{{ lang() === 'ta' ? mod.taLabel : mod.label }}</b>
              <small>{{ mod.category }}</small>
            </span>
            <span class="gl-ng-cmd-go">↵</span>
          </button>
        } @empty {
          <div class="gl-ng-cmd-empty">No matching module found.</div>
        }
      </div>
    </section>
  </div>
}
