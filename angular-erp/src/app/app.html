<div class="gl-ng-ribbon" role="region" aria-label="Goldleaf Angular Live Bar">
  <div class="gl-ng-left">
    <span class="gl-ng-engine-pill" [title]="'Powered by Angular v' + ngVersion + ' Zoneless Signals'">
      <span class="gl-ng-dot"></span>
      <b>Angular {{ ngVersion.split('.')[0] }}</b>
    </span>

    <div class="gl-ng-theme-group" role="group" aria-label="Design style">
      <button
        type="button"
        class="gl-ng-theme-btn"
        [class.is-active]="design() === 'atelier'"
        (click)="pickDesign('atelier')"
        title="Sample 1: Royal Emerald Atelier">
        ◆ {{ lang() === 'ta' ? 'அட்டிலியர்' : 'Atelier' }}
      </button>
      <button
        type="button"
        class="gl-ng-theme-btn"
        [class.is-active]="design() === 'saas'"
        (click)="pickDesign('saas')"
        title="Sample 2: Modern SaaS Pearl">
        ◇ {{ lang() === 'ta' ? 'சாஸ் பேர்ல்' : 'SaaS Pearl' }}
      </button>
      <button
        type="button"
        class="gl-ng-theme-btn"
        [class.is-active]="design() === 'obsidian'"
        (click)="pickDesign('obsidian')"
        title="Sample 3: Obsidian Bullion Pro">
        ● {{ lang() === 'ta' ? 'ஒப்சிடியன்' : 'Obsidian' }}
      </button>
    </div>
  </div>

  <div class="gl-ng-center">
    <button type="button" class="gl-ng-rates-strip" (click)="openRates()" title="Click to open Rate Book">
      <span><small>24K</small><b>{{ formatInr(gold24()) }}</b></span>
      @if (gold24Cash() > 0) {
        <span class="gl-ng-cash-pill"><small>{{ lang() === 'ta' ? '24K ரொக்கம்' : '24K Cash' }}</small><b>{{ formatInr(gold24Cash()) }}</b></span>
      }
      <span><small>22K</small><b>{{ formatInr(gold22()) }}</b></span>
      <span class="gl-ng-hide-xs"><small>{{ lang() === 'ta' ? 'வெள்ளி' : 'Silver' }}</small><b>{{ formatInr(silver()) }}</b></span>
    </button>
  </div>

  <div class="gl-ng-right">
    <button type="button" class="gl-ng-cmd-trigger" (click)="openCmd()" title="Quick Jump to any module (Ctrl+K)">
      <span>⌕ {{ lang() === 'ta' ? 'விரைவு தேடல்' : 'Quick Jump' }}</span>
      <kbd class="gl-ng-hide-sm">Ctrl K</kbd>
    </button>

    <span class="gl-ng-print-status" [class.is-online]="printerLocal()" [title]="printerLocal() ? 'Direct 80mm Citizen Thermal Printer Online' : 'Cloud Print Bridge Ready'">
      {{ printerLocal() ? '🖨 80mm Ready' : '☁ Print Bridge' }}
    </span>

    <div class="gl-ng-lang-group" role="group" aria-label="Language">
      <button type="button" [class.is-active]="lang() === 'en'" (click)="pickLang('en')">EN</button>
      <button type="button" [class.is-active]="lang() === 'ta'" (click)="pickLang('ta')">தமிழ்</button>
    </div>
  </div>
</div>

@if (cmdOpen()) {
  <div class="gl-ng-cmd-backdrop" (click)="closeCmd()">
    <section class="gl-ng-cmd-modal" role="dialog" aria-modal="true" aria-label="Quick Jump" (click)="$event.stopPropagation()">
      <div class="gl-ng-cmd-head">
        <span class="gl-ng-cmd-icon">⌕</span>
        <input
          id="glNgCmdInput"
          type="search"
          [ngModel]="cmdQuery()"
          (ngModelChange)="cmdQuery.set($event)"
          [placeholder]="lang() === 'ta' ? 'பக்கம் தேடுங்கள் (கொட்டேஷன், விற்பனை, சீட்டு, அறிக்கைகள்)…' : 'Jump to Quotation, Sales Entry, Chit, Jewel Loan, 129 Reports…'"
          autocomplete="off" />
        <button type="button" class="gl-ng-cmd-esc" (click)="closeCmd()">ESC</button>
      </div>
      <div class="gl-ng-cmd-list">
        @for (mod of filteredModules(); track mod.id) {
          <button
            type="button"
            class="gl-ng-cmd-item"
            [class.is-current]="activePage() === mod.id"
            (click)="jumpTo(mod)">
            <span class="gl-ng-cmd-item-ico">{{ mod.icon }}</span>
            <span class="gl-ng-cmd-item-txt">
              <b>{{ lang() === 'ta' ? mod.taLabel : mod.label }}</b>
              <small>{{ mod.category }}</small>
            </span>
            <span class="gl-ng-cmd-go">↵</span>
          </button>
        } @empty {
          <div class="gl-ng-cmd-empty">No matching module found.</div>
        }
      </div>
    </section>
  </div>
}
