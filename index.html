</style></head><body><div class="layout"><aside class="side"><div class="brand">Goldleaf<small>JEWELLERY LEDGER</small></div><nav id="nav" class="nav" aria-label="Main navigation"></nav><div id="cloudState" class="foot">Local storage · this device</div></aside><main id="app" class="main"></main></div><div id="toast"></div>
<script>
const navs=['Dashboard','Party Register','Sales Entry','Payments','Party Ledger','Party Summary','Settings'],navIcons=['⌂','♙','＋','↙','▤','◷','⚙'];const dbkey='goldleaf-ledger-v1';const init=()=>({parties:[],sales:[],payments:[],products:['Ring','Chain','Bangle','Earrings','Pendant','Other'],purities:[24,22,20,18,14],cloud:{url:'https://wnfxbzzewibxppfssqyq.supabase.co',key:'sb_publishable_ttfbhy42ax6cBol29sSKAw_bp2SufL1'}});let db=JSON.parse(localStorage.getItem(dbkey)||'null')||init(),page='Dashboard',edit=null,filter={party:'',mode:'All Dates',date:new Date().toISOString().slice(0,10),from:'',to:'',month:new Date().toISOString().slice(0,7)},client=null,session=null;
const $=s=>document.querySelector(s),n=x=>Number(x)||0,fmt=x=>n(x).toFixed(3),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(dbkey,JSON.stringify(db));if(session)pushCloud()}function say(x){$('#toast').textContent=x;setTimeout(()=>$('#toast').textContent='',3000)}function go(x){page=x;edit=null;render()}function toggleMore(){let m=$('#moreMenu');if(m){let open=m.classList.toggle('open');$('#nav .more-button')?.setAttribute('aria-expanded',String(open))}}function person(id){return db.parties.find(x=>x.id===id)}function saleVal(x){return n(x.weight)*n(x.purity)/24*(1+n(x.wastage)/100)}function payVal(x){return x.kind==='Cash'?n(x.amount)/n(x.rate):n(x.weight)*n(x.purity)/100}function bal(id){return n(person(id)?.opening)+db.sales.filter(x=>x.partyId===id).reduce((a,x)=>a+saleVal(x),0)-db.payments.filter(x=>x.partyId===id).reduce((a,x)=>a+payVal(x),0)}function options(v='',all='Select party'){return `<option value="">${all}</option>`+db.parties.map(p=>`<option value="${p.id}" ${p.id===v?'selected':''}>${esc(p.name)}</option>`).join('')}
function render(){ $('#nav').innerHTML=navs.map((x,i)=>`<button class="${x===page?'active':''}" onclick="go('${x}')" aria-label="${x}"><span class="nav-icon">${navIcons[i]}</span><span>${x}</span></button>`).join('')+`<button class="more-button" onclick="toggleMore()" aria-expanded="false"><span class="nav-icon">•••</span><span>More</span></button><div id="moreMenu" class="more-menu">${navs.slice(4).map((x,i)=>`<button onclick="go('${x}')"><span class="nav-icon">${navIcons[i+4]}</span><span>${x}</span></button>`).join('')}</div>`;let fn={'Dashboard':dash,'Party Register':partyView,'Sales Entry':salesView,'Payments':paymentsView,'Party Ledger':ledgerView,'Party Summary':summaryView,'Settings':settingsView}[page];$('#app').innerHTML=fn() }function cloudLabel(){return session?'Cloud sync · '+session.user.email:'Local storage · this device'}function setCloudStatus(v){$('#cloudState').textContent=v;let e=$('#cloudInline');if(e)e.textContent=v}function header(sub,buttons=''){return `<header class="top"><div><div class="eyebrow">GOLDLEAF · ${page.toUpperCase()}</div><h1>${page}</h1><div class="muted">${sub}</div><span class="cloud-inline" id="cloudInline">${cloudLabel()}</span></div>${buttons}</header>`}function card(label,value){return `<div class="card"><label>${label}</label><b>${value}</b></div>`}function dash(){let sales=db.sales.reduce((a,x)=>a+saleVal(x),0),paid=db.payments.reduce((a,x)=>a+payVal(x),0),owing=db.parties.reduce((a,x)=>a+bal(x.id),0);return header('A clear view of party balances and recent activity.',`<button class="primary" onclick="go('Sales Entry')">＋ New sale</button>`)+`<div class="cards">${card('PARTIES',db.parties.length)}${card('SALES PAYABLE',fmt(sales)+' g')}${card('PAYMENTS RECEIVED',fmt(paid)+' g')}${card('OVERALL OWING',fmt(owing)+' g')}</div><section class="panel quick-panel"><div><h2>Quick actions</h2><div class="muted">Start a common task in one tap.</div></div><div class="quick-actions"><button onclick="go('Party Register')">♙ &nbsp; Add party</button><button onclick="go('Sales Entry')">＋ &nbsp; Record sale</button><button onclick="go('Payments')">↙ &nbsp; Add payment</button></div></section><section class="panel"><h2>Recent transactions</h2>${history()}</section><section class="panel hint"><b>Balance guide</b><br>Sales payable = weight × purity ÷ 24 × (1 + wastage%). Metal payment = gross weight × manually entered testing purity% ÷ 100. Cash payment = amount ÷ 24K rate.</section>`}function history(){let all=[...db.sales.map(x=>({...x,type:'Sale',value:saleVal(x),detail:x.product})),...db.payments.map(x=>({...x,type:'Payment',value:-payVal(x),detail:x.kind}))].sort((a,b)=>b.when.localeCompare(a.when)).slice(0,10);return all.length?table(['Date','Party','Type','Details','Pure grams'],all.map(x=>[x.when.replace('T',' '),esc(person(x.partyId)?.name),x.type,esc(x.detail),fmt(Math.abs(x.value))])):'<div class="empty">No transactions yet.</div>'}function table(heads,rows){return `<div class="table"><table><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((x,i)=>`<td data-label="${esc(heads[i])}">${x??''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function partyView(){let p=db.parties.find(x=>x.id===edit);return header('Party details and opening pure gold balance.')+`<section class="panel"><h2>${p?'Edit party':'Register a party'}</h2><form onsubmit="saveParty(event)"><input name="id" type="hidden" value="${p?.id||''}"><div class="grid"><div class="field"><label>Party name *</label><input name="name" required value="${esc(p?.name||'')}"></div><div class="field"><label>Place</label><input name="place" value="${esc(p?.place||'')}"></div><div class="field"><label>Mobile</label><input name="mobile" value="${esc(p?.mobile||'')}"></div><div class="field"><label>Opening balance · pure g</label><input name="opening" type="number" step=".001" value="${p?.opening||0}"></div></div><div class="right">${p?'<button type="button" onclick="edit=null;render()">Cancel</button>':''}<button class="primary">${p?'Save changes':'Add party'}</button></div></form></section><section class="panel"><h2>Registered parties</h2>${db.parties.length?table(['Party','Place','Mobile','Opening g','Owing g',''],db.parties.map(x=>[esc(x.name),esc(x.place),esc(x.mobile),fmt(x.opening),fmt(bal(x.id)),`<button onclick="edit='${x.id}';render()">Edit</button>`])):'<div class="empty">Add your first party. It will populate every party selector.</div>'}</section>`}function saveParty(e){e.preventDefault();let f=new FormData(e.target),id=f.get('id'),name=f.get('name').trim();if(db.parties.some(p=>p.name.toLowerCase()===name.toLowerCase()&&p.id!==id))return say('Party name already exists.');if(id&&!confirm('Save changes to this party?'))return;let x={id:id||crypto.randomUUID(),name,place:f.get('place'),mobile:f.get('mobile'),opening:n(f.get('opening'))};if(id)db.parties[db.parties.findIndex(p=>p.id===id)]=x;else db.parties.push(x);edit=null;save();render();say('Party saved; available in all selectors.')}
function salesView(){let x=db.sales.find(p=>p.id===edit);return header('Record jewellery sales; payable is calculated in pure grams.')+`<section class="panel"><h2>${x?'Edit sale':'New sale'}</h2>${db.parties.length?`<form onsubmit="saveSale(event)"><input name="id" type="hidden" value="${x?.id||''}"><div class="grid"><div class="field"><label>Party *</label><select name="partyId" required onchange="$('#place').value=person(this.value)?.place||''">${options(x?.partyId)}</select></div><div class="field"><label>Place · automatic</label><input id="place" value="${esc(person(x?.partyId)?.place||'')}" readonly></div><div class="field"><label>Date/time</label><input name="when" type="datetime-local" required value="${x?.when||new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)}"></div><div class="field"><label>Product</label><select name="product">${db.products.map(a=>`<option ${a===x?.product?'selected':''}>${esc(a)}</option>`).join('')}</select></div><div class="field"><label>Weight (g)</label><input name="weight" type="number" min=".001" step=".001" required value="${x?.weight||''}" oninput="calcSale(this.form)"></div><div class="field"><label>Pieces</label><input name="pieces" type="number" min="1" value="${x?.pieces||1}"></div><div class="field"><label>Purity</label><select name="purity">${db.purities.map(a=>`<option value="${a}" ${Number(a)===Number(x?.purity||22)?'selected':''}>${a}K</option>`).join('')}</select></div><div class="field"><label>Wastage %</label><input name="wastage" type="number" min="0" step=".01" value="${x?.wastage||0}" oninput="calcSale(this.form)"></div><div class="field"><label>Product photo</label><input name="photo" type="file" accept="image/*"></div><div class="field"><label>Payable pure grams</label><b id="saleCalc">${fmt(x?saleVal(x):0)} g</b></div></div><div class="right">${x?'<button type="button" onclick="edit=null;render()">Cancel</button>':''}<button class="primary">${x?'Save changes':'Save sale'}</button></div></form>`:'<div class="empty">Add a party before recording a sale.</div>'}</section><section class="panel"><h2>Sales history</h2>${table(['Date','Party','Product','Weight','Pieces','Purity','Wastage','Payable g',''],[...db.sales].sort((a,b)=>b.when.localeCompare(a.when)).map(s=>[s.when.replace('T',' '),esc(person(s.partyId)?.name),(s.photo?'<img src="'+s.photo+'" style="width:34px;height:34px;object-fit:cover;border-radius:4px;vertical-align:middle"> ':'')+esc(s.product),fmt(s.weight),s.pieces,s.purity+'K',s.wastage+'%',fmt(saleVal(s)),`<button onclick="edit='${s.id}';render()">Edit</button>`]))}</section>`}function calcSale(f){$('#saleCalc').textContent=fmt(n(f.weight.value)*n(f.purity.value)/24*(1+n(f.wastage.value)/100))+' g'}function saveSale(e){e.preventDefault();let form=e.target,f=new FormData(form),id=f.get('id');if(id&&!confirm('Save changes to this sale?'))return;let old=db.sales.find(s=>s.id===id),commit=photo=>{let x={id:id||crypto.randomUUID(),partyId:f.get('partyId'),when:f.get('when'),product:f.get('product'),weight:n(f.get('weight')),pieces:n(f.get('pieces')),purity:n(f.get('purity')),wastage:n(f.get('wastage')),photo:photo||old?.photo||''};if(id)db.sales[db.sales.findIndex(s=>s.id===id)]=x;else db.sales.push(x);edit=null;save();render();say('Sale saved.')},file=form.photo.files[0];if(file){let r=new FileReader();r.onload=()=>commit(r.result);r.readAsDataURL(file)}else commit('')}
function paymentsView(){let x=db.payments.find(p=>p.id===edit);return header('Record metal, scrap, or cash payments.')+`<section class="panel"><h2>${x?'Edit payment':'New payment'}</h2>${db.parties.length?`<form onsubmit="savePay(event)"><input name="id" type="hidden" value="${x?.id||''}"><div class="grid"><div class="field"><label>Party</label><select name="partyId" required>${options(x?.partyId)}</select></div><div class="field"><label>Date/time</label><input name="when" type="datetime-local" required value="${x?.when||new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)}"></div><div class="field"><label>Kind</label><select name="kind" onchange="togglePay(this.form)"><option ${x?.kind==='Metal Bar'?'selected':''}>Metal Bar</option><option ${x?.kind==='Old Scrap'?'selected':''}>Old Scrap</option><option ${x?.kind==='Cash'?'selected':''}>Cash</option></select></div><div class="field metal ${x?.kind==='Cash'?'hidden':''}"><label>Gross weight g</label><input name="weight" type="number" step=".001" value="${x?.weight||''}"></div><div class="field metal ${x?.kind==='Cash'?'hidden':''}"><label>Testing purity · %</label><input name="purity" type="number" min="1" max="100" step="0.01" value="${x?.purity||''}" required></div><div class="field cash ${x?.kind==='Cash'?'':'hidden'}"><label>Cash amount</label><input name="amount" type="number" step=".01" value="${x?.amount||''}"></div><div class="field cash ${x?.kind==='Cash'?'':'hidden'}"><label>24K rate per gram</label><input name="rate" type="number" step=".01" value="${x?.rate||''}"></div><div class="field"><label>Pure credit (g)</label><b id="payCalc">${fmt(x?payVal(x):0)} g</b></div></div><div class="right">${x?'<button type="button" onclick="edit=null;render()">Cancel</button>':''}<button class="primary">${x?'Save changes':'Save payment'}</button></div></form>`:'<div class="empty">Add a party before recording a payment.</div>'}</section><section class="panel"><h2>Payments history</h2>${table(['Date','Party','Kind','Gross/amount','Purity/rate','Pure credit g',''],[...db.payments].sort((a,b)=>b.when.localeCompare(a.when)).map(p=>[p.when.replace('T',' '),esc(person(p.partyId)?.name),p.kind,p.kind==='Cash'?'₹ '+p.amount:fmt(p.weight)+' g',p.kind==='Cash'?'₹ '+p.rate+'/g':p.purity+'%',fmt(payVal(p)),`<button onclick="edit='${p.id}';render()">Edit</button>`]))}</section>`}function togglePay(f){f.querySelectorAll('.cash').forEach(x=>x.classList.toggle('hidden',f.kind.value!=='Cash'));f.querySelectorAll('.metal').forEach(x=>x.classList.toggle('hidden',f.kind.value==='Cash'))}function savePay(e){e.preventDefault();let f=new FormData(e.target),id=f.get('id'),x={id:id||crypto.randomUUID(),partyId:f.get('partyId'),when:f.get('when'),kind:f.get('kind'),weight:n(f.get('weight')),purity:n(f.get('purity')),amount:n(f.get('amount')),rate:n(f.get('rate'))};if(id&&!confirm('Save changes to this payment?'))return;if(x.kind==='Cash'&&!x.rate)return say('Enter a 24K rate greater than zero.');if(id)db.payments[db.payments.findIndex(p=>p.id===id)]=x;else db.payments.push(x);edit=null;save();render();say('Payment saved.')}
function controls(){return `<div class="filters"><div class="field"><label>Party</label><select onchange="filter.party=this.value;render()">${options(filter.party,'All parties')}</select></div><div class="field"><label>Period</label><select onchange="filter.mode=this.value;render()">${['All Dates','Single Date','Date Range','Monthly'].map(x=>`<option ${x===filter.mode?'selected':''}>${x}</option>`).join('')}</select></div>${filter.mode==='Single Date'?`<div class="field"><label>Date</label><input type="date" value="${filter.date}" onchange="filter.date=this.value;render()"></div>`:''}${filter.mode==='Date Range'?`<div class="field"><label>From</label><input type="date" value="${filter.from}" onchange="filter.from=this.value;render()"></div><div class="field"><label>To</label><input type="date" value="${filter.to}" onchange="filter.to=this.value;render()"></div>`:''}${filter.mode==='Monthly'?`<div class="field"><label>Month</label><input type="month" value="${filter.month}" onchange="filter.month=this.value;render()"></div>`:''}</div>`}function inPeriod(x){let d=x.slice(0,10);return filter.mode==='Single Date'?d===filter.date:filter.mode==='Date Range'?(!filter.from||d>=filter.from)&&(!filter.to||d<=filter.to):filter.mode==='Monthly'?d.slice(0,7)===filter.month:true}function beforePeriod(x){let d=x.slice(0,10),start=filter.mode==='Single Date'?filter.date:filter.mode==='Date Range'?filter.from:filter.mode==='Monthly'?filter.month+'-01':'';return !!start&&d<start}function tx(id){return [...db.sales.filter(x=>(!id||x.partyId===id)&&inPeriod(x.when)).map(x=>({...x,type:'Sale',desc:x.product,amount:saleVal(x)})),...db.payments.filter(x=>(!id||x.partyId===id)&&inPeriod(x.when)).map(x=>({...x,type:'Payment',desc:x.kind,amount:-payVal(x)}))].sort((a,b)=>a.when.localeCompare(b.when))}
function summaryView(){return header('Opening, closing, owing and transaction filters.')+`<section class="panel"><h2>Summary filters</h2>${controls()}</section>${summaryContent()}`}function summaryContent(){let ps=filter.party?[person(filter.party)].filter(Boolean):db.parties;if(!ps.length)return '<section class="panel empty">Add or select a party to see the summary.</section>';let data=ps.map(p=>{let prev=[...db.sales.filter(x=>x.partyId===p.id&&beforePeriod(x.when)).map(x=>saleVal(x)),...db.payments.filter(x=>x.partyId===p.id&&beforePeriod(x.when)).map(x=>-payVal(x))].reduce((a,b)=>a+b,0),rows=tx(p.id),opening=n(p.opening)+prev,sales=rows.filter(x=>x.type==='Sale').reduce((a,x)=>a+x.amount,0),paid=-rows.filter(x=>x.type==='Payment').reduce((a,x)=>a+x.amount,0);return {p,opening,sales,paid,closing:opening+sales-paid}}),sum=k=>data.reduce((a,x)=>a+x[k],0);return `<section class="panel"><div class="cards">${card('OPENING',fmt(sum('opening'))+' g')}${card('SALES',fmt(sum('sales'))+' g')}${card('PAYMENTS',fmt(sum('paid'))+' g')}${card('OVERALL OWING',fmt(sum('closing'))+' g')}</div>${table(['Party','Place','Opening g','Sales g','Payments g','Closing g','Ledger'],data.map(x=>[esc(x.p.name),esc(x.p.place),fmt(x.opening),fmt(x.sales),fmt(x.paid),fmt(x.closing),`<button onclick="filter.party='${x.p.id}';go('Party Ledger')">View</button>`]))}</section>`}
function ledgerView(){let p=person(filter.party);if(!p)return header('Choose a party to inspect its transaction history.')+`<section class="panel"><h2>Ledger filters</h2>${controls()}<div class="empty">Select a party above.</div></section>`;let rows=tx(p.id),before=[...db.sales.filter(x=>x.partyId===p.id&&beforePeriod(x.when)).map(x=>saleVal(x)),...db.payments.filter(x=>x.partyId===p.id&&beforePeriod(x.when)).map(x=>-payVal(x))].reduce((a,b)=>a+b,0);let run=n(p.opening)+before;return header('Full transaction history and running pure gold balance.')+`<section class="panel"><h2>Ledger filters</h2>${controls()}<p>Period opening: <b>${fmt(run)} g</b></p>${table(['Date','Type','Details','Sale debit g','Payment credit g','Running balance g'],rows.map(x=>{run+=x.amount;return [x.when.replace('T',' '),x.type,esc(x.desc),x.type==='Sale'?fmt(x.amount):'—',x.type==='Payment'?fmt(-x.amount):'—',fmt(run)]}))}<p>Closing: <b>${fmt(run)} g</b></p></section>`}
function settingsView(){return header('Manage cloud access, your product lists, and ledger backups.')+`<section class="panel"><h2>Cloud account</h2><p class="hint">Sign in to sync this ledger across devices. This app is already connected to its cloud database; each account can access only its own ledger. Use your email and password below, or create an account.</p><div class="right"><button class="primary" onclick="authForm()">${session?'Sign out':'Sign in / create account'}</button></div><div id="auth" class="hidden"><div class="grid"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>Password</label><input id="password" type="password" minlength="8" autocomplete="current-password" required></div></div><p class="hint">First time here? Choose Create account. Verify your email if prompted, then sign in.</p><div class="right"><button onclick="auth('signup')">Create account</button><button class="primary" onclick="auth('login')">Sign in</button></div></div><p id="cloudMsg" class="hint"></p><details class="setup-details"><summary>Advanced connection settings</summary><p class="hint">Only change these when connecting your own Supabase project.</p><div class="grid"><div class="field wide"><label>Project URL</label><input id="url" value="${esc(db.cloud.url)}" placeholder="https://project.supabase.co"></div><div class="field wide"><label>Anon / publishable key</label><input id="key" value="${esc(db.cloud.key)}"></div></div><div class="right"><button onclick="saveCloud()">Save connection</button></div></details></section><section class="panel"><h2>Products</h2><div class="row">${db.products.map((x,i)=>`<span class="pill">${esc(x)} <button onclick="remove('products',${i})">×</button></span>`).join('')}</div><form class="row" onsubmit="add(event,'products')"><input name="value" required placeholder="New product"><button>Add product</button></form></section><section class="panel"><h2>Purities (karats)</h2><div class="row">${db.purities.map((x,i)=>`<span class="pill">${x}K <button onclick="remove('purities',${i})">×</button></span>`).join('')}</div><form class="row" onsubmit="add(event,'purities')"><input name="value" type="number" min="1" max="24" step=".1" required placeholder="Karat"><button>Add purity</button></form></section><section class="panel"><h2>Backup & setup</h2><p class="hint">Keep a copy of your records or restore from a saved backup.</p><div class="backup-actions"><button onclick="backup()">Download backup</button> <label class="pill">Restore backup<input type="file" hidden accept="application/json" onchange="restore(this)"></label></div><details class="setup-details"><summary>Setup for a different Supabase project</summary><p class="hint">Only needed if you host a separate copy of this app. Run this once in that project’s SQL Editor, then enter its project URL and publishable key above. Never use a service-role key in the browser.</p><pre class="hint">create table public.jewellery_ledgers (user_id uuid primary key references auth.users(id) on delete cascade, payload jsonb not null, updated_at timestamptz default now());
alter table public.jewellery_ledgers enable row level security;
create policy "own select" on public.jewellery_ledgers for select to authenticated using (auth.uid()=user_id);
create policy "own insert" on public.jewellery_ledgers for insert to authenticated with check (auth.uid()=user_id);
create policy "own update" on public.jewellery_ledgers for update to authenticated using (auth.uid()=user_id) with check (auth.uid()=user_id);</pre></details></section>`}function add(e,k){e.preventDefault();let v=new FormData(e.target).get('value');if(k==='purities')v=n(v);if(!db[k].some(x=>String(x).toLowerCase()===String(v).toLowerCase()))db[k].push(v);save();render()}function remove(k,i){if(confirm('Remove from future selections? Existing entries stay unchanged.')){db[k].splice(i,1);save();render()}}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='goldleaf-backup.json';a.click()}function restore(i){let f=i.files[0],r=new FileReader();r.onload=()=>{if(confirm('Replace current data with this backup?')){db=JSON.parse(r.result);save();render()}};r.readAsText(f)}
function saveCloud(){db.cloud={url:$('#url').value.trim().replace(/\/$/,''),key:$('#key').value.trim()};save();client=window.supabase?.createClient(db.cloud.url,db.cloud.key);$('#cloudMsg').textContent=client?'Connection saved. Sign in to sync.':'Enter a valid project URL and key.'}function authForm(){if(session){client.auth.signOut();session=null;setCloudStatus('Local storage · this device');render()}else{$('#auth').classList.toggle('hidden')}}async function auth(mode){try{saveCloud();let res=mode==='signup'?await client.auth.signUp({email:$('#email').value,password:$('#password').value}):await client.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(res.error)throw res.error;session=res.data.session;if(session){$('#cloudMsg').textContent='Signed in. Loading account data…';await pullCloud();render()}else $('#cloudMsg').textContent='Account created. Verify your email if prompted.'}catch(e){$('#cloudMsg').textContent=e.message}}async function pullCloud(){if(!session||!client)return;try{let {data,error}=await client.from('jewellery_ledgers').select('payload').eq('user_id',session.user.id).maybeSingle();if(error)throw error;if(data?.payload){db=data.payload;localStorage.setItem(dbkey,JSON.stringify(db))}else await pushCloud();setCloudStatus('Cloud sync · '+session.user.email)}catch(e){let m=$('#cloudMsg');if(m)m.textContent=e.message}}async function pushCloud(){if(!session||!client)return;try{let {error}=await client.from('jewellery_ledgers').upsert({user_id:session.user.id,payload:db,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;setCloudStatus('Cloud sync · '+session.user.email)}catch(e){let m=$('#cloudMsg');if(m)m.textContent=e.message}}render();
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>if(db.cloud.url&&db.cloud.key){client=window.supabase.createClient(db.cloud.url,db.cloud.key);client.auth.getSession().then(({data})=>{session=data.session;if(session)pullCloud();setCloudStatus(session?'Cloud sync · '+session.user.email:'Local storage · this device')})}</script></body></html>
