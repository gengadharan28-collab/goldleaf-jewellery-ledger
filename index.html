function saveCustomer(e,onSaved){
  e.preventDefault();

  const field=name=>String(f.get(name)||'').trim();
  const name=field('name'),aadhaar=field('aadhaar').replace(/[\s-]/g,''),pan=field('pan').toUpperCase();
  if(!name)return say('Enter the customer name.');
  if(db.customers.some(c=>c.name.toLowerCase()===name.toLowerCase()&&c.id!==id))return say('Customer name already exists.');
  if(aadhaar&&!/^\d{12}$/.test(aadhaar))return say('Enter Aadhaar as 12 digits.');
  if(pan&&!/^[A-Z]{5}\d{4}[A-Z]$/.test(pan))return say('Enter PAN in the format ABCDE1234F.');
  if(id&&!confirm('Save changes to this customer profile?'))return;
  let old=db.customers.find(c=>c.id===id);
  let x={id:id||crypto.randomUUID(),name,city:field('city'),phone:field('phone'),whatsapp:field('whatsapp'),email:field('email'),dob:field('dob'),address:field('address'),aadhaar,pan,openingAmount:n(f.get('openingAmount')),photo:f.get('photo')||old?.photo||'',notes:field('notes')};
  if(id)db.customers[db.customers.findIndex(c=>c.id===id)]=x;else db.customers.push(x);

  if(!onSaved)edit=null;
  save();
  if(onSaved)onSaved(x);else render();
  say('Customer saved.');
}

function rateMoney(value){return '₹ '+n(value).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function rate24Purity(purity){return typeof v2RateForPurity==='function'?v2RateForPurity(purity):n(db.rates.gold24)*n(purity)/24}
function customerSaleTotals(x){
  const weight=n(x.weight),purity=n(x.purity),rate24=n(x.rate24),wastage=n(x.wastage),pieces=n(x.pieces),makingPerPiece=n(x.makingPerPiece),discount=n(x.discount);
  const pureGold=weight*purity/24,purityRate=rate24Purity(purity)||rate24*purity/24,goldAmount=weight*purityRate,wastageGold=pureGold*wastage/100,wastageAmount=weight*wastage/100*purityRate,makingTotal=pieces*makingPerPiece,subtotal=goldAmount+wastageAmount+makingTotal;
  return {pureGold,goldAmount,wastageGold,wastageAmount,makingTotal,subtotal,discount,final:Math.max(0,subtotal-discount),purityRate};
}
function updateCustomerSaleBreakdown(form){

  const t=customerSaleTotals({weight:form.elements.weight.value,purity:form.elements.purity.value,rate24:form.elements.rate24.value,wastage:form.elements.wastage.value,pieces:form.elements.pieces.value,makingPerPiece:form.elements.makingPerPiece.value,discount:form.elements.discount.value});
  const set=(id,value)=>{const e=form.querySelector('#'+id);if(e)e.textContent=value};
  set('saleGoldAmount',rateMoney(t.goldAmount));set('saleWastageAmount',rateMoney(t.wastageAmount));set('saleMakingAmount',rateMoney(t.makingTotal));set('saleSubtotal',rateMoney(t.subtotal));set('saleFinalAmount',rateMoney(t.final));
  form.elements.amount.value=t.final.toFixed(2);
  const adjusted=form.querySelector('#salePurityRateInput');if(adjusted)adjusted.value=rateMoney(t.purityRate);

window.calcSale=function(form){
  if(form&&form.elements.accountType&&form.elements.accountType.value==='customer')return updateCustomerSaleBreakdown(form);
  return goldleafPreviousCalcSale(form);
};
window.saveSale=function(e){
  const form=e.target,type=form.elements.accountType&&form.elements.accountType.value||'party';
  if(type!=='customer')return goldleafPreviousSaveSale(e);
  e.preventDefault();const f=new FormData(form),id=f.get('id'),old=db.sales.find(s=>s.id===id);
  if(id&&!confirm('Save changes to this customer sale?'))return;
  const weight=n(f.get('weight')),purity=n(f.get('purity')),pieces=n(f.get('pieces')),rate24=n(f.get('rate24')),makingPerPiece=n(f.get('makingPerPiece')),wastage=n(f.get('wastage')),discount=n(f.get('discount'));
  if(!f.get('partyId'))return say('Select a customer.');
  if(weight<=0||pieces<1||purity<=0||rate24<=0)return say('Enter a valid weight, piece count, purity, and 24K gold rate.');
  const totals=customerSaleTotals({weight:weight,purity:purity,rate24:rate24,wastage:wastage,pieces:pieces,makingPerPiece:makingPerPiece,discount:discount});
  if(discount>totals.subtotal)return say('Discount cannot be greater than the amount before discount.');
  const commit=photo=>{
    const x=Object.assign({},old||{},{id:id||crypto.randomUUID(),partyId:f.get('partyId'),accountType:'customer',when:f.get('when'),product:f.get('product'),weight:weight,pieces:pieces,purity:purity,wastage:wastage,rate24:rate24,makingPerPiece:makingPerPiece,discount:discount,amount:Math.round(totals.final*100)/100,pureGoldGrams:totals.pureGold,wastageGrams:totals.wastageGold,goldAmount:totals.goldAmount,wastageAmount:totals.wastageAmount,makingTotal:totals.makingTotal,subtotal:totals.subtotal,photo:photo||(old&&old.photo)||''});
    if(id)db.sales[db.sales.findIndex(s=>s.id===id)]=x;else db.sales.push(x);
    edit=null;save();render();say('Customer sale saved in rupees.');
  };
  const photoField=form.querySelector('input[name="photo"][type="file"]'),file=photoField&&photoField.files[0];
  if(file){const reader=new FileReader();reader.onload=()=>commit(reader.result);reader.readAsDataURL(file)}else commit('');
};
